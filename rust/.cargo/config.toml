# ── APPARAT AES (ARMv8 Crypto Extensions) ─────────────────────────
#
# TOPILGAN XATO (foydalanuvchi: "internetim 8-10 MB/s, yuklab olish
# esa 5,5 MB/s dan oshmayapti").
#
# `aes` kutubxonasi (0.8) ARM64 da apparat AES buyruqlarini FAQAT
# `aes_armv8` bayrog'i bilan ishlatadi — bayroqsiz dasturiy AES
# ishlaydi. Har bir yuklangan bo'lak AES-128-CBC bilan shifrlanadi;
# o'lchov (`crypto::tests::shifr_tezligi`, server protsessorida):
#
#   apparat  — shifrlash ~1050 MB/s
#   dasturiy — shifrlash   ~47 MB/s (22 barobar sekin)
#
# Telefonning kichik (tejamkor) yadrolarida dasturiy shifrlash bir
# necha barobar sekinroq — yuklash tezligini aynan shu cheklab
# qo'yardi.
#
# Xavfsiz: bayroq bilan ham AES borligi ISHGA TUSHGANDA tekshiriladi
# (`cpufeatures`, Android'da `getauxval`); AES yo'q eski protsessorda
# avtomatik dasturiy usulga o'tiladi. `cargo-ndk` shu fayldagi
# sozlamalarni hurmat qiladi (o'zi RUSTFLAGS qo'ymaydi).
#
# `polyval_armv8` — kichik fayllardagi AES-256-GCM ning GHASH qismi
# uchun xuddi shunday bayroq.
[target.aarch64-linux-android]
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
