[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib — Android uchun .so, Dart FFI shu bilan ishlaydi
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
