name: Bazani va omborni TOZALASH (bir martalik)

# ═══════════════════════════════════════════════════════════════
#  DIQQAT: BU QAYTARIB BO'LMAYDIGAN AMAL
# ═══════════════════════════════════════════════════════════════
#
# B2'dagi BARCHA fayllar (videolar, rasmlar, avatarlar) va
# Turso'dagi BARCHA jadvallar o'chiriladi. Yangi, tartibli sxemani
# worker birinchi so'rovda o'zi yaratadi.
#
# Faqat QO'LDA ishga tushadi va "TOZALA" deb yozilmaguncha
# bajarilmaydi. Ish tugagach bu fayl repodan o'chiriladi.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tasdiqlash uchun TOZALA deb yozing'
        required: true
        default: ''

jobs:
  wipe:
    if: github.event.inputs.confirm == 'TOZALA'
    runs-on: ubuntu-latest
    # MUHIM: secretlar aynan shu environment ichida turadi.
    environment: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: B2 omborini va Turso bazasini tozalash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          B2_BUCKET: aniraxuz
        run: |
          cat > wipe.mjs <<'SCRIPT'
          const {
            B2_KEY_ID, B2_APPLICATION_KEY, TURSO_URL, TURSO_TOKEN, B2_BUCKET,
          } = process.env;

          const j = async (url, init) => {
            const r = await fetch(url, init);
            const text = await r.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch (_) {}
            if (!r.ok) {
              throw new Error(`${url} -> ${r.status} ${text.slice(0, 300)}`);
            }
            return data;
          };

          // ── 1. B2 ────────────────────────────────────────────
          async function wipeB2() {
            if (!B2_KEY_ID || !B2_APPLICATION_KEY) {
              console.log('B2 kalitlari yo\'q — o\'tkazib yuborildi');
              return;
            }
            const basic = Buffer.from(`${B2_KEY_ID}:${B2_APPLICATION_KEY}`).toString('base64');
            const auth = await j('https://api.backblazeb2.com/b2api/v3/b2_authorize_account', {
              headers: { Authorization: `Basic ${basic}` },
            });
            const api = auth.apiInfo.storageApi;
            const apiUrl = api.apiUrl;
            const token = auth.authorizationToken;

            let bucketId = api.bucketId;
            if (!bucketId) {
              const list = await j(
                `${apiUrl}/b2api/v3/b2_list_buckets?accountId=${auth.accountId}&bucketName=${B2_BUCKET}`,
                { headers: { Authorization: token } },
              );
              bucketId = list.buckets?.[0]?.bucketId;
            }
            if (!bucketId) throw new Error(`B2: "${B2_BUCKET}" bucket topilmadi`);
            console.log(`B2 bucket: ${bucketId}`);

            let startFileName = null;
            let startFileId = null;
            let removed = 0;
            for (;;) {
              const body = { bucketId, maxFileCount: 1000 };
              if (startFileName) body.startFileName = startFileName;
              if (startFileId) body.startFileId = startFileId;
              const page = await j(`${apiUrl}/b2api/v3/b2_list_file_versions`, {
                method: 'POST',
                headers: { Authorization: token, 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
              });
              const files = page.files || [];
              if (files.length === 0) break;

              // 8 tadan parallel — B2 chegarasiga urilmaydi.
              for (let i = 0; i < files.length; i += 8) {
                await Promise.all(files.slice(i, i + 8).map(async (f) => {
                  await j(`${apiUrl}/b2api/v3/b2_delete_file_version`, {
                    method: 'POST',
                    headers: { Authorization: token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileName: f.fileName, fileId: f.fileId }),
                  });
                  removed++;
                }));
              }
              console.log(`  o'chirildi: ${removed}`);
              startFileName = page.nextFileName;
              startFileId = page.nextFileId;
              if (!startFileName) break;
            }
            console.log(`B2 tozalandi: ${removed} ta fayl versiyasi`);
          }

          // ── 2. TURSO ─────────────────────────────────────────
          async function turso(statements) {
            const base = (TURSO_URL || '').replace(/^libsql:\/\//, 'https://').replace(/\/+$/, '');
            const data = await j(`${base}/v2/pipeline`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${TURSO_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                requests: [
                  ...statements.map((sql) => ({ type: 'execute', stmt: { sql } })),
                  { type: 'close' },
                ],
              }),
            });
            const out = [];
            for (const r of data.results || []) {
              if (r.type === 'error') throw new Error(r.error?.message || 'Turso xato');
              out.push(r.response?.result || null);
            }
            return out;
          }

          async function wipeTurso() {
            if (!TURSO_URL || !TURSO_TOKEN) {
              console.log('Turso sozlamalari yo\'q — o\'tkazib yuborildi');
              return;
            }
            const [res] = await turso([
              "SELECT type, name FROM sqlite_master WHERE type IN ('table','view','trigger','index') AND name NOT LIKE 'sqlite_%'",
            ]);
            const rows = res?.rows || [];
            const names = rows.map((r) => ({
              type: (r[0].value ?? r[0]),
              name: (r[1].value ?? r[1]),
            }));
            console.log(`Turso: ${names.length} ta obyekt topildi`);
            if (names.length === 0) return;

            // Tartib muhim: avval trigger/view/index, keyin jadval.
            const order = { trigger: 0, view: 1, index: 2, table: 3 };
            names.sort((a, b) => order[a.type] - order[b.type]);
            const drops = names.map(({ type, name }) => {
              const safe = String(name).replace(/"/g, '""');
              return `DROP ${type.toUpperCase()} IF EXISTS "${safe}"`;
            });
            for (let i = 0; i < drops.length; i += 20) {
              await turso(drops.slice(i, i + 20));
            }
            const [after] = await turso([
              "SELECT COUNT(*) FROM sqlite_master WHERE name NOT LIKE 'sqlite_%'",
            ]);
            const left = after?.rows?.[0]?.[0];
            console.log(`Turso tozalandi. Qolgan obyektlar: ${left?.value ?? left}`);
          }

          await wipeB2();
          await wipeTurso();
          console.log('✅ TAYYOR');
          SCRIPT
          node wipe.mjs
