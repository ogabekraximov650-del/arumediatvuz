name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

# Bir vaqtda FAQAT BITTA build ishlaydi. Avval push va qo'lda ishga
# tushirish (workflow_dispatch) bir vaqtda kelib, bir xil commit uchun
# IKKITA build paydo bo'lardi. Endi yangi build boshlansa, o'sha
# branch uchun eskisi avtomatik bekor qilinadi — ro'yxatda chalkashlik
# bo'lmaydi va CI resursi ham behuda sarflanmaydi.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Rust yadrosini Android uchun kompilyatsiya qilish ──────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # FAQAT IKKITA ABI kompilyatsiya qilinadi:
      #   arm64-v8a   — 64-bitli telefonlar (bugungi kunda deyarli hammasi)
      #   armeabi-v7a — 32-bitli eski telefonlar
      # x86_64 OLIB TASHLANDI: u faqat kompyuterdagi emulyatorlar
      # (Android Studio, BlueStacks) uchun kerak edi va bizga hech qachon
      # kerak emas. Uni olib tashlash APK hajmini ~20 MB kamaytiradi va
      # CI build vaqtini ham qisqartiradi.
      - name: Build rust_core for Android ABIs (64-bit va 32-bit)
        working-directory: rust
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../jniLibs-out \
            build --release

      # ── Flutter ─────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate android folder (agar yo'q bo'lsa)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create --platforms=android --org uz.fulutter .
          fi

      # Kompilyatsiya qilingan .so fayllarni Android loyihasiga joylash —
      # flutter APK build vaqtida ularni avtomatik jniLibs sifatida qo'shadi.
      - name: Copy librust_core.so into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp jniLibs-out/arm64-v8a/librust_core.so android/app/src/main/jniLibs/arm64-v8a/
          cp jniLibs-out/armeabi-v7a/librust_core.so android/app/src/main/jniLibs/armeabi-v7a/
          echo "✅ Rust .so fayllar joylashtirildi:"
          find android/app/src/main/jniLibs -name "*.so"

      - name: INTERNET ruxsatini qo'shish (agar yo'q bo'lsa)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            echo "✅ INTERNET ruxsati qo'shildi"
          else
            echo "✅ INTERNET ruxsati allaqachon bor"
          fi

      # Video kesh-server (lib/services/video_cache_server.dart) ilova
      # ichida mahalliy http://127.0.0.1 manzilda ishlaydi. Android
      # targetSdk 28+ da standart holatda BARCHA shifrlanmagan (cleartext)
      # HTTP ulanishlar (localhost ham) bloklanadi — shu sabab bu yerga
      # faqat 127.0.0.1/localhost uchun cleartext'ga ruxsat beruvchi
      # network_security_config.xml qo'shiladi va manifestga ulanadi.
      - name: Mahalliy kesh-server uchun cleartext (127.0.0.1) ruxsatini qo'shish
        run: |
          RES_XML_DIR="android/app/src/main/res/xml"
          mkdir -p "$RES_XML_DIR"
          cat > "$RES_XML_DIR/network_security_config.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF

          # E'TIBOR: flutter create shablonida <application so'zidan keyin
          # ko'pincha bevosita yangi qator keladi (probel emas) — shu
          # sabab probelga tayanmasdan, <application'dan keyin YANGI
          # qatorga alohida atribut sifatida qo'shiladi (ikkala holatda
          # ham ishlaydi).
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "networkSecurityConfig" "$MANIFEST"; then
            sed -i '0,/<application/s//<application\n        android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
            echo "✅ networkSecurityConfig manifestga ulandi"
          else
            echo "✅ networkSecurityConfig allaqachon bor"
          fi

      - name: Kotlin va compileSdk versiyalarini eng yangisiga moslash
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '[0-9.]*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/" android/app/build.gradle || true
            sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 35/" android/app/build.gradle || true
          fi
          echo "✅ Gradle sozlamalari yangilandi"

      - name: Get dependencies
        run: flutter pub get

      # --split-per-abi: bitta "semiz" APK o'rniga HAR BIR arxitektura
      # uchun ALOHIDA APK yasaladi. Avval bitta APK ichida ikkala (avval
      # uchala) arxitekturaning native kutubxonalari — librust_core.so,
      # libmdk.so, libffmpeg.so — birga turardi. Telefon o'rnatishda
      # faqat O'ZIGA keraklisini olib, qolganini tashlab yuborardi, ya'ni
      # foydalanuvchi hajmning katta qismini bekorga yuklab olardi.
      # Endi har bir APK'da faqat o'z arxitekturasining kutubxonalari
      # bo'ladi va yuklab olish hajmi keskin kamayadi.
      - name: Build APK (Release, har bir ABI uchun alohida)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-arm

      - name: APK hajmlarini ko'rsatish
        run: |
          echo "📦 Tayyor APK fayllar:"
          ls -lh build/app/outputs/flutter-apk/*.apk

      # Ikkita ALOHIDA artifact — shunda 64-bitli telefon egasi 32-bitli
      # APK'ni ham yuklab olishga majbur bo'lmaydi.
      - name: Upload APK (64-bit — zamonaviy telefonlar)
        uses: actions/upload-artifact@v4
        with:
          name: fulutter-64bit-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload APK (32-bit — eski telefonlar)
        uses: actions/upload-artifact@v4
        with:
          name: fulutter-32bit-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Done
        run: |
          echo "✅ APK tayyor! Artifacts bo'limidan yuklab ol:"
          echo "   fulutter-64bit-arm64-v8a      → zamonaviy telefonlar (deyarli hamma)"
          echo "   fulutter-32bit-armeabi-v7a    → eski 32-bitli telefonlar"
