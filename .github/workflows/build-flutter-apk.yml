name: Build Flutter APK

on:
  push:
    # `main`dan tashqari ish (feature) branchlari uchun ham APK
    # yig'iladi — o'zgarishni main'ga qo'shishdan OLDIN qurilmada
    # sinab ko'rish uchun.
    branches: [main, 'claude/**']
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'assets/**'
      # TOPILGAN XATO: `branding/**` bu ro'yxatda YO'Q edi. Shu
      # sabab logotipni o'zgartirgan commit'lar (masalan "plita
      # to'liq qora" va "burchagi yumaloq") HECH QANDAY APK
      # yig'masdi — telefonda esa eski, belgisiz APK turaverardi
      # va "ARU logotipi ko'rinmayapti" deb tushunilardi.
      - 'branding/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

# Bir vaqtda FAQAT BITTA build ishlaydi. Avval push va qo'lda ishga
# tushirish (workflow_dispatch) bir vaqtda kelib, bir xil commit uchun
# IKKITA build paydo bo'lardi. Endi yangi build boshlansa, o'sha
# branch uchun eskisi avtomatik bekor qilinadi — ro'yxatda chalkashlik
# bo'lmaydi va CI resursi ham behuda sarflanmaydi.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# APK'ni Release sifatida chiqarish uchun yozish ruxsati kerak.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Rust yadrosini Android uchun kompilyatsiya qilish ──────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # FAQAT BITTA ABI kompilyatsiya qilinadi (foydalanuvchi talabi):
      #   armeabi-v7a — 32-bitli telefonlar.
      # arm64-v8a va x86_64 OLIB TASHLANDI. 32-bitli kutubxona
      # 64-bitli telefonlarda ham ishlaydi (Android ularni qo'llab-
      # quvvatlaydi), shu sabab bitta ABI barcha ARM qurilmalarni
      # qoplaydi va APK hajmi ~2 barobar kichrayadi.
      - name: Build rust_core for Android (faqat 32-bit / armeabi-v7a)
        working-directory: rust
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -o ../jniLibs-out \
            build --release

      # ── Flutter ─────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate android folder (agar yo'q bo'lsa)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create --platforms=android --org uz.fulutter .
          fi

      # Kompilyatsiya qilingan .so fayllarni Android loyihasiga joylash —
      # flutter APK build vaqtida ularni avtomatik jniLibs sifatida qo'shadi.
      - name: Copy librust_core.so into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp jniLibs-out/armeabi-v7a/librust_core.so android/app/src/main/jniLibs/armeabi-v7a/
          echo "✅ Rust .so fayl joylashtirildi:"
          find android/app/src/main/jniLibs -name "*.so"

      - name: INTERNET ruxsatini qo'shish (agar yo'q bo'lsa)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            echo "✅ INTERNET ruxsati qo'shildi"
          else
            echo "✅ INTERNET ruxsati allaqachon bor"
          fi

      # Video kesh-server (lib/services/video_cache_server.dart) ilova
      # ichida mahalliy http://127.0.0.1 manzilda ishlaydi. Android
      # targetSdk 28+ da standart holatda BARCHA shifrlanmagan (cleartext)
      # HTTP ulanishlar (localhost ham) bloklanadi — shu sabab bu yerga
      # faqat 127.0.0.1/localhost uchun cleartext'ga ruxsat beruvchi
      # network_security_config.xml qo'shiladi va manifestga ulanadi.
      - name: Mahalliy kesh-server uchun cleartext (127.0.0.1) ruxsatini qo'shish
        run: |
          RES_XML_DIR="android/app/src/main/res/xml"
          mkdir -p "$RES_XML_DIR"
          cat > "$RES_XML_DIR/network_security_config.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF

          # E'TIBOR: flutter create shablonida <application so'zidan keyin
          # ko'pincha bevosita yangi qator keladi (probel emas) — shu
          # sabab probelga tayanmasdan, <application'dan keyin YANGI
          # qatorga alohida atribut sifatida qo'shiladi (ikkala holatda
          # ham ishlaydi).
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "networkSecurityConfig" "$MANIFEST"; then
            sed -i '0,/<application/s//<application\n        android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
            echo "✅ networkSecurityConfig manifestga ulandi"
          else
            echo "✅ networkSecurityConfig allaqachon bor"
          fi

      # ── TELEGRAM HAVOLASINI OCHISH UCHUN (Android 11+) ────────
      #
      # Android 11 dan boshlab ilova boshqa ilovalarni "ko'ra"
      # olishi uchun manifestda <queries> e'loni bo'lishi kerak.
      # Usiz `url_launcher` t.me havolasini ochishga urinsa, tizim
      # mos ilovani topa olmasligi mumkin. Shu sabab bu yerga
      # https va tg sxemalari qo'shiladi.
      #
      # flutter create shabloni allaqachon <queries> blokini
      # (PROCESS_TEXT uchun) qo'shadi — shu sabab blok bo'lsa
      # ichiga qo'shamiz, bo'lmasa yangisini yaratamiz.
      - name: Telegram havolasi uchun <queries> qo'shish
        run: |
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          intents = """
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="tg" />
                  </intent>"""

          if 'android:scheme="tg"' in s:
              print("✅ <queries> allaqachon bor")
          elif '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + intents, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print("✅ intent'lar mavjud <queries> blokiga qo'shildi")
          else:
              s = s.replace('</manifest>',
                            '    <queries>' + intents + '\n    </queries>\n</manifest>', 1)
              open(p, 'w', encoding='utf-8').write(s)
              print("✅ yangi <queries> bloki qo'shildi")
          PYEOF

      # ── ILOVA BELGISI (ARU logotipi) ──────────────────────────
      #
      # `android/` papkasi har build'da `flutter create` bilan
      # qaytadan yaratiladi va u BILAN BIRGA Flutter'ning standart
      # ko'k belgisi keladi. Shu sabab bizning belgimiz har safar
      # shu yerda ustiga yoziladi.
      #
      # Fayllar `branding/android-res/` da tayyor turadi (ular
      # `node branding/build-icons.js` bilan SVG'dan chiqarilgan),
      # ya'ni CI'da hech narsa qayta chizilmaydi — faqat ko'chiriladi.
      - name: Ilova belgisini va ochilish ekranini o'rnatish
        run: |
          set -e
          RES="android/app/src/main/res"

          # 1) Flutter shabloni qo'ygan BARCHA eski belgi fayllari
          #    avval O'CHIRILADI. Ilgari faqat ustiga ko'chirilardi:
          #    shablon boshqa nomdagi yoki boshqa zichlikdagi fayl
          #    qo'ysa, u joyida qolib ketardi va Android aynan
          #    o'shani tanlab, ekranda Flutter belgisi ko'rinardi.
          find "$RES" -name 'ic_launcher*' -delete
          rm -f "$RES"/mipmap-anydpi-v26/ic_launcher.xml

          # 2) Bizning fayllar joyiga qo'yiladi (belgi + ARU
          #    logotipli qora ochilish ekrani).
          cp -r branding/android-res/. "$RES"/

          echo "── O'rnatilgan fayllar ──"
          find "$RES" \( -name 'ic_launcher*' -o -name 'launch_background.xml' \
            -o -name 'aru_splash.png' \) | sort

          # 3) Manifest belgiga murojaat qilishiga ishonch hosil qilamiz
          grep -q 'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml \
            || { echo "❌ Manifest @mipmap/ic_launcher ga murojaat qilmayapti"; exit 1; }
          echo "✅ Belgi va ochilish ekrani o'rnatildi"

      # ── ILOVA NOMI ────────────────────────────────────────────
      #
      # `flutter create` nomni loyiha papkasidan oladi va manifestga
      # `android:label="fulutter"` deb yozadi — telefonda belgi
      # ostida aynan shu yozuv turadi. Ilovaning nomi esa ARU.
      - name: Ilova nomini ARU ga o'zgartirish
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="ARU"/' "$MANIFEST"
          grep -q 'android:label="ARU"' "$MANIFEST" \
            || { echo "❌ Ilova nomi o'zgarmadi"; exit 1; }
          echo "✅ Ilova nomi: ARU"

      - name: Kotlin va compileSdk versiyalarini eng yangisiga moslash
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '[0-9.]*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/" android/app/build.gradle || true
            sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 35/" android/app/build.gradle || true
          fi
          echo "✅ Gradle sozlamalari yangilandi"

      - name: Get dependencies
        run: flutter pub get

      # FAQAT 32-BIT (armeabi-v7a) — foydalanuvchi talabi.
      # --split-per-abi ISHLATILMAYDI: bitta APK chiqadi va uni
      # barcha ARM telefonlar (32- va 64-bitlilar) o'rnata oladi.
      - name: Build APK (Release — faqat 32-bit / armeabi-v7a)
        run: |
          flutter build apk --release \
            --target-platform android-arm

      # ── APK HAQIQATAN 32-BIT BO'LISHI SHART ───────────────────
      #
      # TOPILGAN JIDDIY XATO (0.0.1+1 versiyada ham bor edi):
      #
      # `--target-platform android-arm` berilganiga QARAMAY, tayyor
      # APK ichida UCHTA arxitektura papkasi bor edi:
      #   lib/armeabi-v7a, lib/arm64-v8a, lib/x86_64
      # (aapt: `native-code: 'arm64-v8a' 'armeabi-v7a' 'x86_64'`).
      # Bular Flutter embedding AAR'idan kelib qoladi.
      #
      # NEGA BU XAVFLI: Rust yadrosi (`librust_core.so`) FAQAT
      # armeabi-v7a papkasida bor. Android esa 64-bitli telefonda
      # `arm64-v8a` papkasini TANLAYDI va faqat o'shandan kutubxona
      # yuklaydi — ya'ni `librust_core.so` TOPILMAYDI va ilova
      # ochilishida yiqiladi (kesh, qidiruv, shifrlash — hammasi shu
      # kutubxonada).
      #
      # YECHIM: ortiqcha arxitekturalar APK'dan olib tashlanadi.
      # Shundan keyin Android 64-bitli telefonda ham 32-bitli
      # kutubxonalarni ishlatadi (ARM64 qurilmalari 32-bit kodni
      # qo'llab-quvvatlaydi) va librust_core.so har doim topiladi.
      #
      # Imzolash BUNDAN KEYIN bo'ladi — shu sabab o'zgartirilgan APK
      # qaytadan, to'g'ri imzolanadi.
      - name: Ortiqcha arxitekturalarni olib tashlash (faqat armeabi-v7a qolsin)
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "── O'zgartirishdan OLDIN ──"
          unzip -l "$APK" | grep "lib/" || true

          # 32-bitli papkada KERAKLI kutubxonalar borligini tekshiramiz.
          # Bo'lmasa — o'chirish ilovani buzardi, shu sabab build
          # ATAYLAB yiqiladi (jimgina buzuq APK chiqarishdan yaxshiroq).
          for so in libapp.so libflutter.so librust_core.so; do
            if ! unzip -l "$APK" | grep -q "lib/armeabi-v7a/$so"; then
              echo "❌ XATO: lib/armeabi-v7a/$so topilmadi — APK 32-bit uchun to'liq emas"
              exit 1
            fi
          done

          # Qolgan barcha arxitekturalar olib tashlanadi.
          zip -q -d "$APK" "lib/arm64-v8a/*" || true
          zip -q -d "$APK" "lib/x86_64/*" || true
          zip -q -d "$APK" "lib/x86/*" || true

          # `zip -d` fayllar joylashuvini buzadi — .so fayllar xotiraga
          # to'g'ridan-to'g'ri joylashishi (memory-map) uchun APK
          # qaytadan tekislanishi kerak.
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$ZIPALIGN" -f -p 4 "$APK" "$APK.aligned"
          mv "$APK.aligned" "$APK"

          echo "── O'zgartirishdan KEYIN ──"
          unzip -l "$APK" | grep "lib/" || true

      # ── APK'ni ESKI IMZO SXEMASI (v1) BILAN HAM IMZOLASH ──────
      #
      # Android 7.0 dan boshlab APK "v2" sxemasi bilan imzolanadi va
      # zamonaviy Gradle standart holatda FAQAT v2/v3 imzo qo'yadi.
      # Lekin:
      #   * Android 6 va undan eskilar v2 ni UMUMAN bilmaydi — ular
      #     uchun APK "imzosiz" ko'rinadi va o'rnatgichda aynan
      #     "Paketni tahlil qilishda muammo yuz berdi" chiqadi;
      #   * ba'zi qobiqlar (MIUI kabi) va fayl menejerlaridagi
      #     o'rnatgichlar ham v1 imzoni talab qilib qoladi.
      #
      # Shu sabab APK build'dan keyin apksigner bilan QAYTA imzolanadi:
      # v1 + v2 + v3 — ya'ni eski ham, yangi ham qurilmalar qabul
      # qiladi. Kalit — Gradle yaratgan standart debug kaliti.
      - name: APK'ni BARCHA imzo sxemalari bilan (v1..v4) qayta imzolash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KS" -storepass android \
              -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"

          # v1 — Android 6 va undan eskilar UCHUN SHART (aks holda
          #      "Paketni tahlil qilishda muammo" chiqadi);
          # v2 — Android 7+;
          # v3 — Android 9+ (kalitni almashtirishga ruxsat beradi);
          # v4 — Android 11+ (adb bilan tezkor o'rnatish uchun; alohida
          #      .idsig fayl yaratadi va oddiy o'rnatishga xalaqit
          #      bermaydi). Eski build-tools v4 ni bilmasligi mumkin —
          #      shunday holatda v1+v2+v3 bilan qayta imzolanadi.
          # ── NEGA `--min-sdk-version 21` (tuzatilgan xato) ──────
          #
          # Avval imzo tekshiruvi HAR SAFAR shuni ko'rsatardi:
          #   Verified using v1 scheme (JAR signing): FALSE
          # ya'ni `--v1-signing-enabled true` berilgan bo'lsa ham
          # v1 imzo AMALDA QO'YILMASDI. Sabab: apksigner v1 kerakmi
          # yoki yo'qmi degan qarorni APK'ning `minSdkVersion`iga
          # qarab qabul qiladi — u 24 (Android 7) bo'lgani uchun
          # v1 ni "keraksiz" deb o'tkazib yuborardi.
          #
          # Endi apksigner'ga eng past qo'llab-quvvatlanadigan
          # versiya ANIQ aytiladi, shu sabab v1 imzo HAQIQATAN
          # qo'yiladi. Bu ba'zi qobiqlar (MIUI kabi) va fayl
          # menejerlaridagi o'rnatgichlar uchun muhim — ular
          # v1 imzoni talab qilib qoladi va usiz "Paketni tahlil
          # qilishda muammo" deb chiqaradi.
          MIN_SDK=21
          sign_apk() {
            "$APKSIGNER" sign \
              --ks "$KS" --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --min-sdk-version "$MIN_SDK" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$@" "$APK"
          }
          if ! sign_apk --v4-signing-enabled true; then
            echo "⚠️  v4 imzo qo'llab-quvvatlanmadi — v1+v2+v3 bilan imzolanmoqda"
            sign_apk
          fi
          echo "── Imzo tekshiruvi ──"
          "$APKSIGNER" verify -v --min-sdk-version "$MIN_SDK" "$APK" | tee /tmp/verify.txt

          # v1 va v2 HAQIQATAN qo'yilganini TASDIQLAYMIZ — aks holda
          # build ataylab yiqiladi (jimgina yarim imzolangan APK
          # chiqarishdan yaxshiroq).
          for scheme in "v1 scheme (JAR signing)" "v2 scheme (APK Signature Scheme v2)"; do
            if ! grep -q "Verified using $scheme: true" /tmp/verify.txt; then
              echo "❌ XATO: $scheme imzosi qo'yilmadi"
              exit 1
            fi
          done
          echo "✅ v1 va v2 imzolar tasdiqlandi"

      - name: APK tarkibini tekshirish (versiya, arxitektura)
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
          echo "── Ichidagi kutubxonalar ──"
          ABIS=$(unzip -l "$APK" | grep "lib/" | awk '{print $4}' | cut -d/ -f2 | sort -u)
          echo "$ABIS"

          # QAT'IY TEKSHIRUV: APK faqat 32-bit bo'lishi SHART.
          # Boshqa arxitektura qolib ketsa, 64-bitli telefonlar
          # o'shani tanlab, Rust yadrosini topa olmasdi.
          if [ "$ABIS" != "armeabi-v7a" ]; then
            echo "❌ XATO: APK faqat armeabi-v7a bo'lishi kerak edi, ichidagisi: $ABIS"
            exit 1
          fi
          echo "✅ APK faqat 32-bit (armeabi-v7a)"

      # ── APK ICHIDA HAQIQATAN ARU BELGISI BORMI ────────────────
      #
      # NEGA BU QADAM BOR. Ilgari belgini ko'chirish qadami
      # "muvaffaqiyatli" tugagani bilan tayyor APK'da belgi
      # bo'lishiga KAFOLAT yo'q edi: ko'chirishdan keyin nimadir
      # ustiga yozsa yoki fayl boshqa papkaga tushsa, build baribir
      # yashil chiqardi va faqat telefonda "Flutter belgisi turibdi"
      # deb bilinardi.
      #
      # NEGA BAYT SOLISHTIRILMAYDI: Android qurish tizimi (aapt2)
      # PNG'larni QAYTA siqadi (masalan palitrali formatga o'tkazadi),
      # shu sabab APK ichidagi fayl manbadagidan bayt jihatdan
      # farq qiladi. Shuning uchun RASMNING O'ZI ochib ko'riladi:
      #
      #   * ARU belgisi — faqat qora va oq;
      #   * Flutter'ning standart belgisi — KO'K (#42A5F5).
      #
      # Ya'ni ko'k piksel topilsa, demak belgi almashmagan.
      - name: APK ichidagi belgi ARU ekanini tasdiqlash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)

          # Ilova nomi
          LABEL=$("$AAPT" dump badging "$APK" | grep -m1 "^application-label:" || true)
          echo "$LABEL"
          echo "$LABEL" | grep -q "'ARU'" \
            || { echo "❌ XATO: ilova nomi ARU emas"; exit 1; }

          # Belgi fayllarining APK ichidagi yo'llari
          "$AAPT" dump badging "$APK" \
            | grep -oE "^application-icon-[0-9]+:'[^']+'" \
            | sed "s/.*:'//;s/'$//" | sort -u > /tmp/icons.txt
          echo "── Belgi fayllari ──"; cat /tmp/icons.txt
          [ -s /tmp/icons.txt ] || { echo "❌ XATO: APK'da belgi yo'q"; exit 1; }

          TMP=$(mktemp -d)
          while read -r f; do unzip -o -q "$APK" -d "$TMP" "$f" || true; done < /tmp/icons.txt
          # Zaxira yo'l: badging faqat adaptiv belgining XML'ini
          # ko'rsatishi mumkin — u holda PNG qolmaydi va tekshirish
          # bekorga yiqilardi. Shu sabab mipmap papkasi ham olinadi.
          unzip -o -q "$APK" -d "$TMP" 'res/mipmap*' || true

          python3 - "$TMP" <<'PYEOF'
          import sys, os, zlib, struct

          def decode(path):
              """Tashqi kutubxonasiz PNG o'qish (zlib bilan)."""
              d = open(path, 'rb').read()
              if d[:8] != b'\x89PNG\r\n\x1a\n':
                  return None
              i, idat, pal, hdr = 8, b'', b'', None
              while i < len(d):
                  ln = struct.unpack('>I', d[i:i+4])[0]
                  typ = d[i+4:i+8]; body = d[i+8:i+8+ln]
                  if typ == b'IHDR': hdr = struct.unpack('>IIBBBBB', body)
                  elif typ == b'PLTE': pal = body
                  elif typ == b'IDAT': idat += body
                  elif typ == b'IEND': break
                  i += 12 + ln
              w, h, depth, color, _, _, inter = hdr
              if inter: return None
              ch = {0:1, 2:3, 3:1, 4:2, 6:4}[color]
              if depth == 8:
                  bpp, stride = ch, w * ch
              elif color == 3 and depth in (1, 2, 4):
                  bpp, stride = 1, (w * depth + 7) // 8
              else:
                  return None
              raw = zlib.decompress(idat)
              out, prev, pos = [], bytearray(stride), 0
              for _y in range(h):
                  f = raw[pos]; pos += 1
                  line = bytearray(raw[pos:pos+stride]); pos += stride
                  for x in range(stride):
                      a = line[x-bpp] if x >= bpp else 0
                      b = prev[x]
                      c = prev[x-bpp] if x >= bpp else 0
                      if f == 1: line[x] = (line[x] + a) & 255
                      elif f == 2: line[x] = (line[x] + b) & 255
                      elif f == 3: line[x] = (line[x] + (a + b) // 2) & 255
                      elif f == 4:
                          pa, pb, pc = abs(b-c), abs(a-c), abs(a+b-2*c)
                          pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                          line[x] = (line[x] + pr) & 255
                  out.append(bytes(line)); prev = line
              px = []
              for line in out:
                  if depth == 8:
                      for x in range(w):
                          p = line[x*ch:(x+1)*ch]
                          if color == 3:
                              k = p[0]*3; px.append((pal[k], pal[k+1], pal[k+2], 255))
                          elif color == 0: px.append((p[0], p[0], p[0], 255))
                          elif color == 4: px.append((p[0], p[0], p[0], p[1]))
                          elif color == 2: px.append((p[0], p[1], p[2], 255))
                          else: px.append((p[0], p[1], p[2], p[3]))
                  else:
                      per = 8 // depth; mask = (1 << depth) - 1
                      for x in range(w):
                          byte = line[x // per]
                          shift = 8 - depth * (x % per + 1)
                          k = ((byte >> shift) & mask) * 3
                          px.append((pal[k], pal[k+1], pal[k+2], 255))
              return px

          root = sys.argv[1]
          files = [os.path.join(dp, f) for dp, _, fs in os.walk(root)
                   for f in fs if f.endswith('.png')]
          if not files:
              print("❌ XATO: belgi fayli ochilmadi"); sys.exit(1)

          checked = 0
          for f in files:
              px = decode(f)
              if px is None:
                  print(f"   ⚠️  {f} — o'qib bo'lmadi, o'tkazib yuborildi")
                  continue
              checked += 1
              blue = sum(1 for r, g, b, a in px if a > 40 and b > 90 and b > r + 40 and b > g + 20)
              total = max(1, sum(1 for _r, _g, _b, a in px if a > 40))
              share = 100.0 * blue / total
              print(f"   {os.path.basename(f)}: ko'k piksel {share:.1f}%")
              if share > 5.0:
                  print("❌ XATO: belgi KO'K — bu Flutter'ning standart belgisi.")
                  print("   ARU belgisi APK'ga tushmagan.")
                  sys.exit(1)
          if checked == 0:
              print("❌ XATO: birorta belgi fayli tekshirilmadi"); sys.exit(1)
          print(f"✅ Belgi ARU (qora/oq) — {checked} ta fayl tekshirildi")
          PYEOF

          rm -rf "$TMP"

      - name: APK hajmini ko'rsatish
        run: |
          echo "📦 Tayyor APK:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk


      # ── APK'ni TO'G'RIDAN-TO'G'RI yuklab olinadigan qilib chiqarish ──
      #
      # Muammo: GitHub "Artifacts" bo'limidagi fayl HAR DOIM ZIP ichida
      # beriladi. Telefonda uni avval ochish (extract) kerak; ochilmagan
      # ZIP'ni o'rnatishga urinilsa Android "Paketni tahlil qilishda
      # muammo yuz berdi" deydi — bu APK buzuq degani EMAS.
      #
      # Shu sabab APK Release sifatida ham chiqariladi: u yerdan
      # telefonga TO'G'RIDAN-TO'G'RI .apk fayli yuklanadi va darhol
      # o'rnatiladi, hech narsani ochish shart emas.
      - name: APK'ni Release sifatida chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fulutter APK (build ${{ github.run_number }})
          body: |
            Telefonga to'g'ridan-to'g'ri o'rnatish uchun quyidagi
            `app-release.apk` faylini yuklab oling (ZIP emas).

            Commit: ${{ github.sha }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk

      # ── ARTIFACT YUKLASH — MAJBURIY EMAS ──────────────────────
      #
      # TUZATILGAN XATO: bu qadam ilgari Release'dan OLDIN turardi
      # va "Artifact storage quota has been hit" xatosi bilan
      # yiqilardi. Natijada APK muvaffaqiyatli qurilib, imzolanib
      # turgani holda Release qadami umuman ishga tushmasdi — ya'ni
      # tayyor APK'ni HECH QAYERDAN yuklab bo'lmasdi.
      #
      # Endi:
      #   * Release BIRINCHI chiqadi (telefonga to'g'ridan-to'g'ri
      #     yuklab olinadigan asosiy yo'l);
      #   * artifact esa qo'shimcha nusxa va `continue-on-error`
      #     bilan — kvota to'lgan bo'lsa build baribir muvaffaqiyatli
      #     hisoblanadi.
      - name: Upload APK Artifact (qo'shimcha nusxa)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fulutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Done
        run: |
          echo "✅ APK tayyor! Artifacts → fulutter-app-release"
          echo "   Faqat 32-bit (armeabi-v7a), imzolar: v1+v2+v3(+v4)."
