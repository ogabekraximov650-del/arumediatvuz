name: Build Flutter APK

on:
  push:
    # `main`dan tashqari ish (feature) branchlari uchun ham APK
    # yig'iladi — o'zgarishni main'ga qo'shishdan OLDIN qurilmada
    # sinab ko'rish uchun.
    branches: [main, 'claude/**']
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

# Bir vaqtda FAQAT BITTA build ishlaydi. Avval push va qo'lda ishga
# tushirish (workflow_dispatch) bir vaqtda kelib, bir xil commit uchun
# IKKITA build paydo bo'lardi. Endi yangi build boshlansa, o'sha
# branch uchun eskisi avtomatik bekor qilinadi — ro'yxatda chalkashlik
# bo'lmaydi va CI resursi ham behuda sarflanmaydi.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Rust yadrosini Android uchun kompilyatsiya qilish ──────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # FAQAT IKKITA ABI kompilyatsiya qilinadi:
      #   arm64-v8a   — 64-bitli telefonlar (bugungi kunda deyarli hammasi)
      #   armeabi-v7a — 32-bitli eski telefonlar
      # x86_64 OLIB TASHLANDI: u faqat kompyuterdagi emulyatorlar
      # (Android Studio, BlueStacks) uchun kerak edi va bizga hech qachon
      # kerak emas. Uni olib tashlash APK hajmini ~20 MB kamaytiradi va
      # CI build vaqtini ham qisqartiradi.
      - name: Build rust_core for Android ABIs (64-bit va 32-bit)
        working-directory: rust
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../jniLibs-out \
            build --release

      # ── Flutter ─────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate android folder (agar yo'q bo'lsa)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create --platforms=android --org uz.fulutter .
          fi

      # Kompilyatsiya qilingan .so fayllarni Android loyihasiga joylash —
      # flutter APK build vaqtida ularni avtomatik jniLibs sifatida qo'shadi.
      - name: Copy librust_core.so into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp jniLibs-out/arm64-v8a/librust_core.so android/app/src/main/jniLibs/arm64-v8a/
          cp jniLibs-out/armeabi-v7a/librust_core.so android/app/src/main/jniLibs/armeabi-v7a/
          echo "✅ Rust .so fayllar joylashtirildi:"
          find android/app/src/main/jniLibs -name "*.so"

      - name: INTERNET ruxsatini qo'shish (agar yo'q bo'lsa)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            echo "✅ INTERNET ruxsati qo'shildi"
          else
            echo "✅ INTERNET ruxsati allaqachon bor"
          fi

      # Video kesh-server (lib/services/video_cache_server.dart) ilova
      # ichida mahalliy http://127.0.0.1 manzilda ishlaydi. Android
      # targetSdk 28+ da standart holatda BARCHA shifrlanmagan (cleartext)
      # HTTP ulanishlar (localhost ham) bloklanadi — shu sabab bu yerga
      # faqat 127.0.0.1/localhost uchun cleartext'ga ruxsat beruvchi
      # network_security_config.xml qo'shiladi va manifestga ulanadi.
      - name: Mahalliy kesh-server uchun cleartext (127.0.0.1) ruxsatini qo'shish
        run: |
          RES_XML_DIR="android/app/src/main/res/xml"
          mkdir -p "$RES_XML_DIR"
          cat > "$RES_XML_DIR/network_security_config.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF

          # E'TIBOR: flutter create shablonida <application so'zidan keyin
          # ko'pincha bevosita yangi qator keladi (probel emas) — shu
          # sabab probelga tayanmasdan, <application'dan keyin YANGI
          # qatorga alohida atribut sifatida qo'shiladi (ikkala holatda
          # ham ishlaydi).
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "networkSecurityConfig" "$MANIFEST"; then
            sed -i '0,/<application/s//<application\n        android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
            echo "✅ networkSecurityConfig manifestga ulandi"
          else
            echo "✅ networkSecurityConfig allaqachon bor"
          fi

      - name: Kotlin va compileSdk versiyalarini eng yangisiga moslash
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '[0-9.]*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/" android/app/build.gradle || true
            sed -i "s/compileSdk = flutter.compileSdkVersion/compileSdk = 35/" android/app/build.gradle || true
          fi
          echo "✅ Gradle sozlamalari yangilandi"

      - name: Get dependencies
        run: flutter pub get

      # fvp gradle bosqichida SourceForge'dan mdk-sdk-android.7z
      # (~200 MB) yuklab oladi va uni pub-cache ichiga ochadi. Uni
      # keshlash ikki foyda beradi: (a) build sezilarli tezlashadi,
      # (b) SourceForge'ning uzilib qolishi (bu build'ni yiqitgan asl
      # sabab) keyingi safar UMUMAN takrorlanmaydi.
      #
      # DIQQAT: kesh faqat build MUVAFFAQIYATLI tugagandagina
      # saqlanadi (pastdagi "Save" qadamiga qarang) — aks holda yarim
      # yuklangan, buzuq holat keshlanib qolishi mumkin edi.
      - name: fvp/mdk-sdk keshini tiklash
        id: mdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.pub-cache/hosted/pub.dev/fvp-0.38.1
          key: mdk-sdk-${{ runner.os }}-fvp-0.38.1

      # BITTA APK ichida IKKALA arxitektura (64-bit + 32-bit).
      # --split-per-abi ISHLATILMAYDI: foydalanuvchi bitta fayl olishi
      # va qaysi birini tanlashni o'ylab o'tirmasligi kerak. Telefon
      # o'rnatishda o'ziga keraklisini avtomatik oladi.
      # x86_64 esa --target-platform orqali chetlab o'tiladi (u faqat
      # kompyuterdagi emulyatorlar uchun edi).
      #
      # 3 MARTA QAYTA URINISH — SABAB: fvp (video pleyer) kutubxonasi
      # gradle bosqichida SourceForge'dan mdk-sdk-android.7z (~200 MB)
      # yuklab oladi. SourceForge vaqti-vaqti bilan ulanishni yarmida
      # uzib qo'yadi ("Failure when receiving data from the peer") va
      # butun build shu sabab yiqiladi — kodda hech qanday xato
      # bo'lmasa ham. Qayta urinishdan oldin fvp'ning yarim qolgan
      # kompilyatsiya papkasi tozalanadi, aks holda buzuq yuklamadan
      # qayta foydalanishga urinardi.
      - name: Build APK (Release — 64-bit va 32-bit bitta APK ichida)
        run: |
          for i in 1 2 3; do
            echo "▶ Urinish $i/3"
            if flutter build apk --release \
                 --target-platform android-arm64,android-arm; then
              echo "✅ Build muvaffaqiyatli ($i-urinishda)"
              exit 0
            fi
            echo "⚠ Urinish $i muvaffaqiyatsiz."
            if [ "$i" -lt 3 ]; then
              echo "   Yarim qolgan fvp yuklamasi tozalanmoqda..."
              rm -rf ~/.pub-cache/hosted/pub.dev/fvp-*/android/.cxx || true
              rm -rf build/fvp || true
              echo "   30 soniyadan keyin qayta urinamiz..."
              sleep 30
            fi
          done
          echo "❌ 3 urinishdan keyin ham build bo'lmadi"
          exit 1

      - name: fvp/mdk-sdk keshini saqlash
        if: success() && steps.mdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pub-cache/hosted/pub.dev/fvp-0.38.1
          key: mdk-sdk-${{ runner.os }}-fvp-0.38.1

      - name: APK hajmini ko'rsatish
        run: |
          echo "📦 Tayyor APK:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Done
        run: |
          echo "✅ APK tayyor! Artifacts → fulutter-app-release"
          echo "   Ichida 64-bit (arm64-v8a) va 32-bit (armeabi-v7a) bor."
