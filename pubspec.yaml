name: fulutter
description: "Anime kontent ko'rish ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  image_picker: ^1.1.2
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  # Video yuklashda real-time progress uchun
  dio: ^5.4.0
  # Video pleyr: video_player (ochiq API) + fvp (ichki mexanizm/decoding backend)
  video_player: ^2.9.2
  fvp: ^0.38.1
  # Asosiy shifrlash kalitini xavfsiz saqlash uchun. Android'da
  # EncryptedSharedPreferences (Keystore bilan himoyalangan) ishlatadi,
  # ya'ni kalit qurilmadan chiqmaydi va root'siz o'qib bo'lmaydi.
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
