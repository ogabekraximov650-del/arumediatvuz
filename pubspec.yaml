name: fulutter
description: "Anime kontent ko'rish ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  image_picker: ^1.1.2
  # Internet holati kuzatish
  connectivity_plus: ^6.0.5
  # Rust yadrosi bilan gaplashish uchun (kesh, qidiruv, validatsiya)
  ffi: ^2.1.3
  path_provider: ^2.1.4
  # Rasmlarni diskda keshlash — B2 so'rovlarini kamaytiradi
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
