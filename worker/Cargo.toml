[package]
name = "aniraxuz-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers Rust SDK — worker-build talab qiladigan versiya
worker = "0.8.5"
# JSON serialize/deserialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# WASM hajmini kamaytirish va tezlikni oshirish
opt-level = "s"
lto = true
codegen-units = 1
